name: .NET Core

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ./src/ClashRoyale/ClashRoyale.csproj

      - name: Build
        run: dotnet build ./src/ClashRoyale/ClashRoyale.csproj --configuration Release --no-restore
